name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: |
          version=$(node scripts/version.mjs)
          echo "VITE_APP_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_RUDDERSTACK_DATA_PLANE_URL: https://analytics.script.it
          VITE_RUDDERSTACK_WRITE_KEY: ${{ secrets.RUDDERSTACK_FRONTEND_WRITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
