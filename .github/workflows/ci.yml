name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/version.mjs --check-placeholder
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run test:packages
        env:
          JSON_VIEWS_CONSUMER_REACT_MAJOR: 18
      - run: npm run test:packages
        env:
          JSON_VIEWS_CONSUMER_REACT_MAJOR: 19
